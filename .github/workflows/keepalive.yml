name: Keep alive

# Supabase pauses free projects after 7 days without database activity.
# This daily ping wakes the app and runs a tiny query so that never happens.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the app and touch the database
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Set the APP_URL repository variable (e.g. https://expense-app.onrender.com)."
            exit 0
          fi
          # Render's free tier can take about a minute to wake up.
          curl -fsS --retry 6 --retry-delay 20 --retry-all-errors --max-time 90 "${APP_URL%/}/healthz?db=1"
